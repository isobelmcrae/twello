name: Publish container
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full source commit SHA to build
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source_ref }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/isobelmcrae/twello:${{ inputs.source_ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/isobelmcrae/twello
            org.opencontainers.image.revision=${{ inputs.source_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
