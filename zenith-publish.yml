x-zenith:
  catalog:
    name: Twello
    description: Private shared kanban boards with sticky notes, task assignments, and shared invitation links.
    authors: [Isobel]
    source: https://github.com/isobelmcrae/twello
    license: UNLICENSED
    tags: [productivity, kanban, nextjs, postgres]
  expose:
    - { service: web, port: 3000, web: true }
  env:
    PGPASSWORD:
      generate: '([A-Za-z0-9_-]{16})([A-Za-z0-9_-]{16})'
      services: [web]
    POSTGRES_PASSWORD:
      alias: PGPASSWORD
      services: [db]
    BETTER_AUTH_SECRET:
      generate: '([A-Za-z0-9_-]{16})([A-Za-z0-9_-]{16})([A-Za-z0-9_-]{16})'
      services: [web]
    BETTER_AUTH_URL:
      alias: ZENITH_PUBLIC_URL
      services: [web]

services:
  web:
    image: ghcr.io/isobelmcrae/twello:7735330e33c7a1b21ac3f5b97bd3e293462ee76b
    ports:
      - "3000:3000"
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: twello
      PGDATABASE: twello
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: twello
      POSTGRES_DB: twello
    volumes:
      - twello_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twello -d twello"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  twello_data:
